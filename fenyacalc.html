<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电阻分压计算器</title>
    <style>
        .container { max-width: 800px; margin: 20px auto; padding: 20px; }
        .input-group { margin: 15px 0; }
        label { display: inline-block; width: 120px; }
        input[type="number"] { width: 150px; margin-left: 10px; }
        button { padding: 8px 15px; margin: 10px 0; }
        #resultTable { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
        .log { background-color: #f9f9f9; padding: 15px; margin: 10px 0; }
    </style>
</head>

<body>
    <div class="container">
        <h2>电阻分压计算器</h2>
        <div class="input-group"><label>阻值下限(Ω):</label><input type="number" step="0.01" id="rMin" value="100"></div>
        <div class="input-group"><label>阻值上限(Ω):</label><input type="number" step="0.01" id="rMax" value="1000"></div>
        <div class="input-group"><label>测量下限*:</label><input type="number" step="0.01" id="mMin"></div>
        <div class="input-group"><label>测量上限*:</label><input type="number" step="0.01" id="mMax"></div>
        <div class="input-group"><label>ADC位数:</label><input type="number" id="adcBits" value="12"></div>
        <p style="color:#f66">带*为可选项</p>
        <div style="display:flex;justify-content:space-around;width:100%;">
        <button onclick="btnCalcOnClick()">计算阻值</button><button onclick="btnCheckOnClick()">精度筛选</button>
        </div>
        <div class="log" id="outputLog"></div>
        <table id="resultTable" hidden>
            <thead>
                <tr>
                    <th>阻值(Ω)</th>
                    <th>分度</th>
                    <th>精度</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
    <script>
        let hist = {};
        let okir = 0, minir = 0, ra =0, rr = 0;
        let rb = 0;
        let rtext="";
        function btnCalcOnClick() {
            hist = {};
            const a = parseFloat(document.getElementById('rMin').value);
            const b = parseFloat(document.getElementById('rMax').value);
            const ar = parseFloat(document.getElementById('mMin').value) || 0;
            const br = parseFloat(document.getElementById('mMax').value) || 0;
            const r = parseInt(document.getElementById('adcBits').value);
            rb = r;
            ra = 1.00;
            if(ar && br) ra = Math.abs(ar - br);
            
            okir = 0;
            minir = Math.pow(2, r) + 1;
            rr = Math.pow(2, r);
        
            let output = [];
            for(let i = Math.floor(a/3); i < 3*b; i++) {
                const ir = Math.abs(a/(a+i) - b/(b+i));
                output.push(`${i}Ω: ${ir*rr.toFixed(4)}`);
                
                if(ir > okir) {
                    okir = ir;
                    oki = i;
                } else if(ir < minir) {
                    minir = ir;
                }
                hist[i] = ir;
            }
            rtext = `
                最佳分压阻值：${oki.toFixed(4)}Ω<br>
                分度: 1/${Math.round(okir*rr)}<br>
                精度: ${(ra/okir/rr).toFixed(parseInt(Math.log(rr)+1))}
            `;
            document.getElementById('outputLog').innerHTML = rtext;
            document.getElementById('outputLog').style.display = 'block';
        }
        
        function btnCheckOnClick() {
            if(!rtext) btnCalcOnClick();
            const th = parseInt(prompt(`请选择精度下限(${parseInt(minir*rr)}-${parseInt(okir*rr)}):`, parseInt(minir*rr)))/rr;
            if(isNaN(th)) return;
            if(th>parseInt(okir*rr)) th= parseInt(okir*rr);
            const rs = [];
            let flag = false;
            let rmi=oki*10;
            let rma=0;
            for(const [key, value] of Object.entries(hist)) {
                if(value === okir) flag = true;
                if(value >= th) {
                    rs.push([key, (value*rr).toFixed(1), (ra/(value*rr)).toFixed(parseInt(Math.log(rr)+1))]);
                } else {
                    if(flag) break;
                }
            }
        
            const tbody = document.getElementById('resultBody');
            tbody.innerHTML = rs.map(([r, d, p]) => {
                r=parseInt(r);
                if(rma<r) rma=r;
                if(rmi>r) rmi=r;
                return `<tr><td>${r}Ω</td><td>1/${d}</td><td>${p}</td></tr>`;}
            ).join('');
            
            
            document.getElementById('resultTable').hidden = false;
            document.getElementById('outputLog').innerHTML = `${rtext}<br />筛选出的范围:${rmi}Ω-${rma}Ω
            `;
        }
    </script>
</body>

</html>
